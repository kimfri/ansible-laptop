---
- name: Install terminator with dnf
  ansible.builtin.dnf:
    name: "{{ basic_terminator_package }}"
    state: present
  become: true

- name: Install fzf with dnf
  ansible.builtin.dnf:
    name: "{{ basic_fzf_package }}"
    state: present
  become: true

- name: Install make with dnf
  ansible.builtin.dnf:
    name: "{{ basic_make_package }}"
    state: present
  become: true

- name: Install bash-git-prompt
  ansible.builtin.git:
    repo: "{{ basic_bash_git_prompt_repo }}"
    dest: "{{ basic_bash_git_prompt_dest }}"
    version: "{{ basic_bash_git_prompt_version }}"
    depth: 1
    update: false

- name: Configure Visual Studio Code
  ansible.builtin.import_tasks: vscode.yml

- name: Configure Podman
  ansible.builtin.import_tasks: podman.yml

- name: Configure bash functions
  ansible.builtin.import_tasks: bash_functions.yml

- name: Add fzf bash integration comment
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    regexp: '^# Set up fzf key bindings and fuzzy completion$'
    line: "# Set up fzf key bindings and fuzzy completion"
    insertbefore: '^eval "\$\(fzf --bash\)"$'
    create: true

- name: Enable fzf bash key bindings and completion
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    regexp: '^eval "\$\(fzf --bash\)"$'
    line: 'eval "$(fzf --bash)"'
    create: true

- name: Set editor in .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    regexp: '^export EDITOR='
    line: "export EDITOR={{ basic_editor }}"
    create: true

- name: Add aliases to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    regexp: '^alias {{ item.name }}='
    line: 'alias {{ item.name }}="{{ item.command }}"'
    insertafter: '^alias '
    create: true
  loop: "{{ basic_bash_aliases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wrap existing bash-git-prompt block in .bashrc
  ansible.builtin.replace:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    regexp: '(?m)(?:# BEGIN ANSIBLE MANAGED BLOCK: bash-git-prompt\n)?(if \[ -f "\$HOME/\.bash-git-prompt/gitprompt\.sh" \]; then\n    GIT_PROMPT_ONLY_IN_REPO=1\n    source "\$HOME/\.bash-git-prompt/gitprompt\.sh"\nfi)(?:\n# END ANSIBLE MANAGED BLOCK: bash-git-prompt)?'
    replace: '# BEGIN ANSIBLE MANAGED BLOCK: bash-git-prompt\n\1\n# END ANSIBLE MANAGED BLOCK: bash-git-prompt'

- name: Ensure bash-git-prompt block exists in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: bash-git-prompt"
    block: |
      if [ -f "$HOME/.bash-git-prompt/gitprompt.sh" ]; then
          GIT_PROMPT_ONLY_IN_REPO=1
          source "$HOME/.bash-git-prompt/gitprompt.sh"
      fi
    create: true
