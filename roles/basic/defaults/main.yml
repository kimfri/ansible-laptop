---
basic_terminator_package: terminator
basic_fzf_package: fzf
basic_make_package: make
basic_podman_packages:
  - podman
  - podman-compose
basic_bash_git_prompt_repo: https://github.com/magicmonty/bash-git-prompt.git
basic_bash_git_prompt_version: master
basic_bash_git_prompt_dest: "{{ ansible_facts['user_dir'] }}/.bash-git-prompt"
basic_editor: /usr/bin/vim
basic_code_dir: "{{ ansible_facts['user_dir'] }}/code"
basic_bash_aliases:
  - name: l
    command: "ls -l"
